---
# tasks file for rsysloging-server
 
- name: "Assert all required variables are set"
  fail: msg="Variable '{{ item }}' is not defined!"
  when: item not in vars
  with_items: "{{ slf_required_vars }}"

- name: Assert local variables
  include_tasks: assert-local-variables.yml
  when: slf_local_env

- name: Assert cloud variables
  include_tasks: assert-cloud-variables.yml
  when: not slf_local_env

- name: Ensure rsyslog is installed
  apt:
    name: rsyslog
    update_cache: yes

- name: Include TLS configuration 
  include_tasks: configure-tls.yml
  when: slf_destination_protocol == "tls"

- name: "60-forward-to-man.conf"
  template:
    src: 60-forward-to-man.conf.j2
    dest: /etc/rsyslog.d/60-forward-to-man.conf
  notify: slf_rsyslog_restart
